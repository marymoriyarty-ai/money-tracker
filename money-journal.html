Views.transactions = function(root, params){
  const tf = { q:params.q||'', type:'all', category:'', source:'', account:'', month:'', sort:'date-desc' };
  function filtered(){
    let list = T.all();
    if(tf.q){
      const q = tf.q.toLowerCase();
      list = list.filter(t=>{
        const hay = [t.person,t.merchant,t.description,t.category,t.notes,(t.tags||[]).join(' '),t.paymentMethod].filter(Boolean).join(' ').toLowerCase();
        return hay.includes(q);
      });
    }
    if(tf.type!=='all') list = list.filter(t=>t.kind===tf.type);
    if(tf.category) list = list.filter(t=>t.category===tf.category);
    if(tf.source==='linked') list = list.filter(t=>!!t.sourceId);
    else if(tf.source==='unlinked') list = list.filter(t=>!t.sourceId);
    else if(tf.source) list = list.filter(t=>t.sourceId===tf.source);
    if(tf.account) list = list.filter(t=>t.accountId===tf.account);
    if(tf.month) list = list.filter(t=> monthKey(t.date)===tf.month);
    // sort
    if(tf.sort==='date-desc') list.sort((a,b)=>(b.date||'').localeCompare(a.date||''));
    else if(tf.sort==='date-asc') list.sort((a,b)=>(a.date||'').localeCompare(b.date||''));
    else if(tf.sort==='amount-desc') list.sort((a,b)=>(b.amount||0)-(a.amount||0));
    else if(tf.sort==='amount-asc') list.sort((a,b)=>(a.amount||0)-(b.amount||0));
    return list;
  }
  function render(){
    const list = filtered();
    const inc = list.filter(t=>t.kind==='income').reduce((s,t)=>s+t.amount,0);
    const exp = list.filter(t=>t.kind==='expense').reduce((s,t)=>s+t.amount,0);
    const cats = [...new Set(State.transactions.map(t=>t.category).filter(Boolean))].sort();
    const months = [...new Set(State.transactions.map(t=>monthKey(t.date)).filter(Boolean))].sort().reverse();
    root.innerHTML = `
      <div class="card card-pad" style="margin-bottom:14px">
        <div class="filters" style="margin-bottom:10px">
          <div class="seg" id="typeSeg">
            <button data-v="all" class="${tf.type==='all'?'active':''}">All</button>
            <button data-v="income" class="${tf.type==='income'?'active':''}">Income</button>
            <button data-v="expense" class="${tf.type==='expense'?'active':''}">Expense</button>
          </div>
          <span style="flex:1"></span>
          <select class="chip" id="sortSel">
            <option value="date-desc" ${tf.sort==='date-desc'?'selected':''}>Newest first</option>
            <option value="date-asc" ${tf.sort==='date-asc'?'selected':''}>Oldest first</option>
            <option value="amount-desc" ${tf.sort==='amount-desc'?'selected':''}>Amount: high→low</option>
            <option value="amount-asc" ${tf.sort==='amount-asc'?'selected':''}>Amount: low→high</option>
          </select>
        </div>
        <div class="filters">
          <select class="chip" id="catSel"><option value="">All categories</option>${cats.map(c=>`<option ${tf.category===c?'selected':''}>${esc(c)}</option>`).join('')}</select>
          <select class="chip" id="srcSel"><option value="">All sources</option><option value="linked" ${tf.source==='linked'?'selected':''}>Linked only</option><option value="unlinked" ${tf.source==='unlinked'?'selected':''}>Unlinked only</option>${S.all().map(s=>`<option value="${s.id}" ${tf.source===s.id?'selected':''}>${esc(s.person)} — ${fmtMoney(s.amount)}</option>`).join('')}</select>
          <select class="chip" id="accSel"><option value="">All accounts</option>${A.active().map(a=>`<option value="${a.id}" ${tf.account===a.id?'selected':''}>${esc(a.name)}</option>`).join('')}</select>
          <select class="chip" id="monthSel"><option value="">All months</option>${months.map(m=>`<option value="${m}" ${tf.month===m?'selected':''}>${monthLabel(m)}</option>`).join('')}</select>
        </div>
      </div>
      <div class="grid" style="grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px">
        <div class="stat income"><div class="label">Filtered Income</div><div class="value amount pos" style="font-size:20px">${maskedMoney(inc)}</div></div>
        <div class="stat expense"><div class="label">Filtered Expenses</div><div class="value amount neg" style="font-size:20px">${maskedMoney(exp)}</div></div>
        <div class="stat net"><div class="label">Net</div><div class="value amount" style="font-size:20px">${maskedMoney(inc-exp)}</div></div>
      </div>
      <div class="card card-pad">
        <div class="sec-title">History <span class="sub">${list.length} transactions</span></div>
        <div class="list" id="txList">${list.length? list.map(txRowHTML).join('') : '<div class="empty"><div class="eic">'+IC.transactions+'</div><h4>No transactions found</h4><p>Adjust filters or add a new transaction.</p></div>'}</div>
      </div>`;
    // bind
    $$('#typeSeg button').forEach(b=> b.onclick=()=>{ tf.type=b.dataset.v; render(); });
    $('#sortSel').onchange = e=>{ tf.sort=e.target.value; render(); };
    $('#catSel').onchange = e=>{ tf.category=e.target.value; render(); };
    $('#srcSel').onchange = e=>{ tf.source=e.target.value; render(); };
    $('#accSel').onchange = e=>{ tf.account=e.target.value; render(); };
    $('#monthSel').onchange = e=>{ tf.month=e.target.value; render(); };
    bindTxRows($('#txList'));
  }
  render();
  // global search wired
  const gs = $('#globalSearch');
  if(gs){ gs.value = tf.q; gs.oninput = ()=>{ tf.q=gs.value; render(); }; }
};

    <div class="form-row"><label>Money Source</label>
      <select id="linkSel">${avail.map(s=>`<option value="${s.id}" ${s.id===t.sourceId?'selected':''}>${esc(s.person)} — ${fmtMoney(s.amount)} (${fmtMoney(Calc.sourceRemaining(s.id))} remaining)</option>`).join('')}</select>
    </div>
    ${t.sourceId?`<p class="muted" style="font-size:12px">Currently linked to <b>${esc(S.get(t.sourceId)?.person||'—')}</b>. Choosing another will move the attribution.</p>`:''}
  `, {footer:`<button class="btn btn-ghost" id="linkRemove" style="margin-right:auto">Remove link</button><button class="btn btn-ghost" data-close-btn>Cancel</button><button class="btn btn-primary" id="linkSave">Save</button>`});
  $('#linkSave').onclick = async ()=>{ await T.update(txId, {sourceId: $('#linkSel').value || null}); toast('Link updated','success'); closeModal(); navigate('journey'); };
  $('#linkRemove').onclick = async ()=>{ await T.update(txId, {sourceId:null}); toast('Link removed','success'); closeModal(); navigate('journey'); };
}

function openAccountForm(editId){
  const a = editId? A.get(editId) : null;
  const isEdit = !!a;
  const colors = ['#294B91','#236C57','#8D354A','#7a4b9a','#b5763a','#5a6ec0','#c0392b','#5c6373'];
  openModal(isEdit?'Edit Account':'New Account', `
    <form id="accForm">
      <div class="form-row"><label>Account Name *</label><input name="name" value="${a?esc(a.name):''}" placeholder="e.g. Cash, Bank, Wallet" required /></div>
      <div class="form-grid-2">
        <div class="form-row"><label>Type *</label>
          <select name="type">${['cash','bank','wallet','savings','credit','other'].map(t=>`<option value="${t}" ${a&&a.type===t?'selected':''}>${t.charAt(0).toUpperCase()+t.slice(1)}</option>`).join('')}</select>
        </div>
        <div class="form-row"><label>Currency</label>
          <select name="currency">${Object.keys(CURRENCY).map(c=>`<option value="${c}" ${a&&a.currency===c||(!a&&c===State.settings.currency)?'selected':''}>${c} (${CURRENCY[c].symbol})</option>`).join('')}</select>
        </div>
      </div>
      <div class="form-row"><label>Initial Balance</label><input name="initial" type="text" inputmode="decimal" value="${a?fmtMoney(a.initial||0,{symbol:false,compact:true}):'0'}" /></div>
      <div class="form-row"><label>Color</label><div style="display:flex;gap:8px;flex-wrap:wrap">${colors.map(c=>`<button type="button" name="colorBtn" data-c="${c}" style="width:30px;height:30px;border-radius:8px;background:${c};border:${(a&&a.color===c)||(!a&&c==='#294B91')?'2.5px solid var(--text)':'2px solid transparent'}"></button>`).join('')}</div></div>
    </form>`, {footer:`${isEdit?'<button class="btn btn-danger" id="aDel" style="margin-right:auto">Archive</button>':''}<button class="btn btn-ghost" data-close-btn>Cancel</button><button class="btn btn-primary" id="aSave">${isEdit?'Save':'Create'}</button>`});
  let selectedColor = a?a.color:'#294B91';
  $$('[name=colorBtn]').forEach(b=> b.onclick=()=>{ selectedColor=b.dataset.c; $$('[name=colorBtn]').forEach(x=>x.style.border='2px solid transparent'); b.style.border='2.5px solid var(--text)'; });
  $('#aSave').onclick = async ()=>{
    const f=$('#accForm');
    if(!f.name.value.trim()){ toast('Name required','error'); return; }
    const data = { name:f.name.value.trim(), type:f.type.value, currency:f.currency.value, initial:parseMoney(f.initial.value), color:selectedColor };
    if(isEdit){ await A.update(editId, data); toast('Account updated','success'); }
    else { await A.add(data); toast('Account created','success'); }
    closeModal(); navigate('accounts');
  };
  if(isEdit) $('#aDel').onclick = ()=> confirmModal('Archive this account? Its history is preserved; transactions keep their account reference. You can restore it later.', async ()=>{ await A.remove(editId); toast('Account archived','success'); closeModal(); navigate('accounts'); }, {danger:true, yes:'Archive'});
}
function openAccountDetail(id){

  const bal = Calc.accountBalance(a.id);
  const txns = State.transactions.filter(t=>t.accountId===id).sort((x,y)=>(y.date||'').localeCompare(x.date||''));
  const xfers = State.transfers.filter(x=>x.fromAccountId===id||x.toAccountId===id).sort((x,y)=>(y.date||'').localeCompare(x.date||''));
  openModal('Account: '+a.name, `
    <div style="display:flex;align-items:center;gap:12px;padding-bottom:12px;border-bottom:1px solid var(--line)">
      <div style="width:44px;height:44px;border-radius:12px;background:${a.color};display:grid;place-items:center;color:#fff">${IC.wallet}</div>
      <div style="flex:1"><div style="font-weight:600;font-size:16px">${esc(a.name)}</div><div class="muted" style="font-size:11.5px;text-transform:capitalize">${esc(a.type)} · ${esc(a.currency)}</div></div>
      <div style="text-align:right"><div class="muted" style="font-size:11px">Balance</div><div class="amount" style="font-weight:600;font-size:18px">${maskedMoney(bal)}</div></div>
    </div>
    <div class="grid" style="grid-template-columns:1fr 1fr;gap:8px;margin-top:12px">
      <div class="kv"><span class="k">Initial</span><span class="v">${fmtMoney(a.initial||0)}</span></div>
      <div class="kv"><span class="k">Income</span><span class="v pos">${fmtMoney(Calc.accountIncome(id))}</span></div>
      <div class="kv"><span class="k">Expenses</span><span class="v neg">${fmtMoney(Calc.accountExpenses(id))}</span></div>
      <div class="kv"><span class="k">Transfers in</span><span class="v pos">${fmtMoney(Calc.accountTransfersIn(id))}</span></div>
      <div class="kv"><span class="k">Transfers out</span><span class="v neg">${fmtMoney(Calc.accountTransfersOut(id))}</span></div>
    </div>
    <div class="sec-title" style="margin-top:14px">History (${txns.length+xfers.length})</div>
    <div class="list">${[...txns.map(t=>({...t,_tx:true})), ...xfers.map(x=>({...x,_x:true}))].sort((a,b)=>(b.date||'').localeCompare(a.date||'')).slice(0,30).map(it=>{
      if(it._x){ const f=A.get(it.fromAccountId),t=A.get(it.toAccountId); return `<div class="tx-row"><div class="tx-ic" style="background:var(--royal)">${IC.transfer}</div><div class="tx-main"><div class="t1">${esc(f?.name||'?')} → ${esc(t?.name||'?')}</div><div class="t2">${fmtDate(it.date)}${it.notes?' · '+esc(it.notes):''}</div></div><div class="tx-amt amount">${fmtMoney(it.amount)}</div></div>`; }
      return txRowHTML(it);
    }).join('') || '<div class="empty" style="padding:18px"><p>No activity on this account yet.</p></div>'}</div>
  `, {footer:`<button class="btn btn-ghost" style="margin-right:auto" data-close-btn>Close</button><button class="btn btn-ghost" id="adEdit">${IC.edit} Edit</button><button class="btn btn-primary" id="adXfer">${IC.transfer} Transfer</button>`, size:'lg'});
  $('#adEdit').onclick = ()=>{ closeModal(); openAccountForm(id); };
  $('#adXfer').onclick = ()=>{ closeModal(); openTransferForm(); };
}

/* ============================================================
   CALENDAR VIEW
   ============================================================ */
Views.calendar = function(root, params){
  const today = new Date();
  let cur = { y: today.getFullYear(), m: today.getMonth(), selected: todayISODate() };
  if(params.date){ const d=new Date(params.date); cur={y:d.getFullYear(),m:d.getMonth(),selected:params.date}; }
  function render(){
    const first = new Date(cur.y, cur.m, 1);
    const startDay = (first.getDay()+6)%7; // Monday-first
    const daysInMonth = new Date(cur.y, cur.m+1, 0).getDate();
    const mk = cur.y+'-'+String(cur.m+1).padStart(2,'0');
    const dailyExp = Calc.dailyExpenses(mk), dailyInc = Calc.dailyIncome(mk);
    const totalExp = Object.values(dailyExp).reduce((s,v)=>s+v,0);
    const totalInc = Object.values(dailyInc).reduce((s,v)=>s+v,0);
    let cells = '';
    for(let i=0;i<startDay;i++) cells += '<div class="cal-cell empty"></div>';
    for(let d=1; d<=daysInMonth; d++){
      const dateStr = `${cur.y}-${String(cur.m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const isToday = dateStr === todayISODate();
      const isSel = dateStr === cur.selected;
      const inc = dailyInc[dateStr]||0, exp = dailyExp[dateStr]||0;
      const net = inc - exp;
      const has = inc>0 || exp>0;
      cells += `<div class="cal-cell ${isToday?'today':''} ${isSel?'selected':''}" data-date="${dateStr}">
        <div class="d">${d}</div>
        ${has?`<div class="ind">${inc>0?'<div class="bar" style="background:var(--emerald-2)"></div>':''}${exp>0?'<div class="bar" style="background:var(--crimson-2)"></div>':''}</div>`:''}
        ${has?`<div class="net ${net>=0?'pos':'neg'} amount">${fmtMoneyShort(net)}</div>`:''}
      </div>`;
    }
    const selTxns = Calc.dayTransactions(cur.selected);
    const selNet = Calc.dayNet(cur.selected);
    root.innerHTML = `
      <div class="grid" style="grid-template-columns:1.4fr 1fr;gap:14px">
        <div class="card card-pad">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
            <button class="icon-btn" id="prevM">${IC.chevronLeft}</button>
            <div style="text-align:center"><div style="font-family:var(--font-display);font-weight:600;font-size:17px">${first.toLocaleDateString('en-US',{month:'long',year:'numeric'})}</div></div>
            <button class="icon-btn" id="nextM">${IC.chevronRight}</button>
          </div>
          <div class="cal-head">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<div>${d}</div>`).join('')}</div>
          <div class="cal-grid">${cells}</div>
          <div class="divider"></div>
          <div class="filters">
            <span class="tag" style="background:var(--emerald-soft);color:var(--emerald-2)"><span class="dot" style="background:var(--emerald-2)"></span>Income</span>
            <span class="tag" style="background:var(--crimson-soft);color:var(--crimson-2)"><span class="dot" style="background:var(--crimson-2)"></span>Expense</span>
            <span style="flex:1"></span>
            <span class="muted" style="font-size:12px">Income ${fmtMoney(totalInc)} · Expenses ${fmtMoney(totalExp)}</span>
          </div>
        </div>
        <div class="card card-pad">
          <div class="sec-title">${fmtDate(cur.selected, {weekday:'long'})} <span class="sub">${fmtDate(cur.selected)}</span></div>
          <div class="grid" style="grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px">
            <div class="stat income" style="padding:10px"><div class="label" style="font-size:10px">Income</div><div class="value pos" style="font-size:14px">${maskedMoney(selNet.income)}</div></div>
            <div class="stat expense" style="padding:10px"><div class="label" style="font-size:10px">Expenses</div><div class="value neg" style="font-size:14px">${maskedMoney(selNet.expenses)}</div></div>
            <div class="stat net" style="padding:10px"><div class="label" style="font-size:10px">Net</div><div class="value" style="font-size:14px">${maskedMoney(selNet.net)}</div></div>
          </div>
          <div class="list" id="dayList">${selTxns.length? selTxns.map(txRowHTML).join('') : '<div class="empty" style="padding:18px"><div class="eic">'+IC.calendar+'</div><h4>No transactions</h4><p>Nothing recorded on this day.</p></div>'}</div>
        </div>
      </div>`;
    $('#prevM').onclick = ()=>{ cur.m--; if(cur.m<0){cur.m=11;cur.y--;} render(); };
    $('#nextM').onclick = ()=>{ cur.m++; if(cur.m>11){cur.m=0;cur.y++;} render(); };
    $$('.cal-cell[data-date]').forEach(c=> c.onclick=()=>{ cur.selected=c.dataset.date; render(); });
    bindTxRows($('#dayList'));
  }
  render();
};

        ${archived.length?`<div class="divider"></div><div class="sec-title">Archived (${archived.length})</div>${archived.map(c=>`<div class="kv"><span class="k">${esc(c.icon||'')} ${esc(c.name)}</span><button class="btn btn-ghost btn-sm" data-restore="${c.id}">Restore</button></div>`).join('')}`:''}

    $$('#kindSeg button').forEach(b=> b.onclick=()=>{ kind=b.dataset.v; render(); });
    $('#newCat').onclick = ()=> openCategoryForm(kind);
    $$('[data-edit]').forEach(b=> b.onclick=()=> openCategoryForm(kind, b.dataset.edit));
    $$('[data-del]').forEach(b=> b.onclick=()=> confirmModal(`Archive category "${C.get(b.dataset.del)?.name}"? Historical transactions keep their category name.`, async ()=>{ await C.remove(b.dataset.del); toast('Category archived','success'); render(); }, {danger:true, yes:'Archive'}));
    $$('[data-restore]').forEach(b=> b.onclick=async ()=>{ await C.update(b.dataset.restore, {archivedAt:null}); toast('Restored','success'); render(); });
    requestAnimationFrame(()=> drawDonut($('#catChart'), totals, ['#8D354A','#294B91','#236C57','#7a4b9a','#b5763a','#5a6ec0','#c0392b','#5c6373']));
  }
  render();
};
function openCategoryForm(kind, editId){
  const c = editId? C.get(editId) : null;
  const isEdit = !!c;
  const colors = ['#8D354A','#294B91','#236C57','#7a4b9a','#b5763a','#5a6ec0','#c0392b','#5c6373','#3a9d8f','#d97706'];
  const icons = ['🍔','🚌','📚','🛍️','💆','💊','🎬','📌','🎓','🎁','💼','🏠','✈️','☕','👕','📱','🎮','💻','🏥','🚗'];
  openModal(isEdit?'Edit Category':'New Category', `
    <form id="catForm">
      <div class="form-row"><label>Category Name *</label><input name="name" value="${c?esc(c.name):''}" required placeholder="e.g. Groceries" /></div>
      <div class="form-row"><label>Color</label><div style="display:flex;gap:8px;flex-wrap:wrap">${colors.map(col=>`<button type="button" name="colorBtn" data-c="${col}" style="width:30px;height:30px;border-radius:8px;background:${col};border:${(c&&c.color===col)||(!c&&col===colors[0])?'2.5px solid var(--text)':'2px solid transparent'}"></button>`).join('')}</div></div>
      <div class="form-row"><label>Icon</label><div style="display:flex;gap:6px;flex-wrap:wrap">${icons.map(ic=>`<button type="button" name="iconBtn" data-i="${ic}" style="width:36px;height:36px;border-radius:8px;background:var(--surface-2);font-size:18px;border:${(c&&c.icon===ic)?'2px solid var(--royal-2)':'1px solid var(--line)'}">${ic}</button>`).join('')}</div></div>

Views.analytics = function(root, params){
  const mk = monthKey(new Date().toISOString());
  let range = params.range || '6m'; // 1m,3m,6m,1y,all
  let customStart = '', customEnd = '';
  function rangeFilter(){
    if(range==='all') return ()=>true;
    const now = new Date();
    let start;
    if(range==='1m'){ start = new Date(now.getFullYear(), now.getMonth()-1, 1); }
    else if(range==='3m'){ start = new Date(now.getFullYear(), now.getMonth()-3, 1); }
    else if(range==='6m'){ start = new Date(now.getFullYear(), now.getMonth()-6, 1); }
    else if(range==='1y'){ start = new Date(now.getFullYear()-1, now.getMonth(), 1); }
    else if(range==='custom'){ const s=customStart+'T00:00:00', e=(customEnd||customStart)+'T23:59:59'; return t=> t.date>=s && t.date<=e; }
    return t=> new Date(t.date) >= start;
  }
  function render(){
    const f = rangeFilter();
    const inc = Calc.totalIncome(f), exp = Calc.totalExpenses(f);
    const months = range==='1m'?[mk]: range==='3m'?[addMonths(mk,-2),addMonths(mk,-1),mk]: range==='6m'?[addMonths(mk,-5),addMonths(mk,-4),addMonths(mk,-3),addMonths(mk,-2),addMonths(mk,-1),mk]: range==='1y'?Array.from({length:12},(_,i)=>addMonths(mk,-11+i)): range==='custom'?[]: [];
    const expByCat = Calc.expensesByCategory(f);
    const incByCat = Calc.incomeByCategory(f);
    const incByPerson = Calc.incomeByPerson(f);
    const expByMerchant = Calc.expensesByMerchant(f);
    root.innerHTML = `
      <div class="card card-pad" style="margin-bottom:14px">
        <div class="filters">
          <div class="seg" id="rangeSeg">
            <button data-v="1m" class="${range==='1m'?'active':''}">1M</button>
            <button data-v="3m" class="${range==='3m'?'active':''}">3M</button>
            <button data-v="6m" class="${range==='6m'?'active':''}">6M</button>
            <button data-v="1y" class="${range==='1y'?'active':''}">1Y</button>
            <button data-v="all" class="${range==='all'?'active':''}">All</button>
            <button data-v="custom" class="${range==='custom'?'active':''}">Custom</button>
          </div>
          <span style="flex:1"></span>
          <button class="btn btn-ghost btn-sm" id="csvExp">${IC.download} Export CSV</button>
        </div>
        ${range==='custom'?`<div class="form-grid-2" style="margin-top:12px"><div class="form-row"><label>From</label><input id="csFrom" type="date" value="${customStart||todayISODate()}" /></div><div class="form-row"><label>To</label><input id="csTo" type="date" value="${customEnd||todayISODate()}" /></div></div>`:''}
      </div>
      <div class="stats-grid" style="margin-bottom:14px">
        <div class="stat net"><div class="label">Net Movement</div><div class="value amount">${maskedMoney(inc-exp)}</div></div>
        <div class="stat income"><div class="label">Total Income</div><div class="value amount pos" style="font-size:22px">${maskedMoney(inc)}</div></div>
        <div class="stat expense"><div class="label">Total Expenses</div><div class="value amount neg" style="font-size:22px">${maskedMoney(exp)}</div></div>
        <div class="stat"><div class="label">Savings Rate</div><div class="value amount" style="font-size:22px">${inc>0?Math.round((inc-exp)/inc*100):0}%</div></div>
      </div>
      <div class="grid" style="grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px">
        <div class="card card-pad">
          <div class="sec-title">Income vs Expenses Trend</div>
          <div class="chart-wrap" style="height:240px"><canvas id="anTrend"></canvas></div>
        </div>
        <div class="card card-pad">
          <div class="sec-title">Cumulative Balance</div>
          <div class="chart-wrap" style="height:240px"><canvas id="anCum"></canvas></div>
        </div>
      </div>
      <div class="grid" style="grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px">
        <div class="card card-pad">
          <div class="sec-title">Spending by Category</div>
          <div class="chart-wrap" style="height:260px"><canvas id="anCat"></canvas></div>
        </div>
        <div class="card card-pad">
          <div class="sec-title">Income by Person / Source</div>
          <div class="chart-wrap" style="height:260px"><canvas id="anPerson"></canvas></div>
        </div>
      </div>
      <div class="grid" style="grid-template-columns:1fr 1fr;gap:14px">
        <div class="card card-pad">
          <div class="sec-title">Top Merchants / Locations</div>
          <div class="chart-wrap" style="height:220px"><canvas id="anMerch"></canvas></div>
        </div>
        <div class="card card-pad">
          <div class="sec-title">Month-over-Month Comparison</div>
          <div class="chart-wrap" style="height:220px"><canvas id="anMoM"></canvas></div>
          <div class="kv"><span class="k">This month income</span><span class="v pos">${maskedMoney(Calc.monthlyIncome(mk))}</span></div>
          <div class="kv"><span class="k">Last month income</span><span class="v">${maskedMoney(Calc.monthlyIncome(addMonths(mk,-1)))}</span></div>
          <div class="kv"><span class="k">This month expenses</span><span class="v neg">${maskedMoney(Calc.monthlyExpenses(mk))}</span></div>
          <div class="kv"><span class="k">Last month expenses</span><span class="v">${maskedMoney(Calc.monthlyExpenses(addMonths(mk,-1)))}</span></div>
        </div>
      </div>`;
    $$('#rangeSeg button').forEach(b=> b.onclick=()=>{ range=b.dataset.v; render(); });
    if(range==='custom'){ $('#csFrom').onchange=e=>{customStart=e.target.value;render();}; $('#csTo').onchange=e=>{customEnd=e.target.value;render();}; }
    $('#csvExp').onclick = ()=> exportCSV();
    requestAnimationFrame(()=>{
      const labels = months.map(m=>new Date(m.split('-')[0],m.split('-')[1]-1,1).toLocaleDateString('en-US',{month:'short'}));
      drawLine($('#anTrend'), [
        {label:'Income',values:months.map(m=>Calc.monthlyIncome(m)),color:_colorVar('--emerald-2')},
        {label:'Expenses',values:months.map(m=>Calc.monthlyExpenses(m)),color:_colorVar('--crimson-2')}
      ], {labels});
      // cumulative balance
      let cum = Calc.initialBalance();
      const cumVals = months.map(m=>{ cum += Calc.monthlyNet(m); return cum; });
      drawLine($('#anCum'), [{label:'Balance',values:cumVals,color:_colorVar('--royal-2')}], {labels});
      drawDonut($('#anCat'), expByCat, ['#8D354A','#294B91','#236C57','#7a4b9a','#b5763a','#5a6ec0','#c0392b','#5c6373']);
      drawDonut($('#anPerson'), incByPerson, ['#236C57','#294B91','#7a4b9a','#b5763a','#5a6ec0','#8D354A']);
      drawBars($('#anMerch'), expByMerchant, ['#294B91','#345cb0','#1f3a72','#4a6db8']);
      drawMonthlyCompare($('#anMoM'), mk);
    });
  }
  render();
};

/* ---------- CSV export ---------- */
function exportCSV(){
  const txns = T.all().sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  const header = ['Type','Date','Time','Amount','Currency','Category','Person/Merchant','Description/Reason','Account','PaymentMethod','LinkedSource','Tags','Notes'];
  const rows = txns.map(t=>{
    const acc = A.get(t.accountId)?.name||'';
    const src = t.sourceId? (S.get(t.sourceId)?.person||''):'';
    return [t.kind, dateFromISO(t.date), fmtTime(t.date), (t.amount/100).toFixed(2), t.currency||State.settings.currency, t.category||'', t.person||t.merchant||'', t.reason||t.description||'', acc, t.paymentMethod||'', src, (t.tags||[]).join(';'), (t.notes||'').replace(/[\n,]/g,' ')];
  });
  const csv = [header, ...rows].map(r=> r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob(['\ufeff'+csv], {type:'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download='money-journal-transactions-'+todayISODate()+'.csv'; a.click();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
  toast('CSV exported','success');
}

/* ---------- Backup & restore ---------- */
async function buildSnapshot(){
  return {
    app:'moneyjournal', version:1, createdAt:nowISO(),
    user:State.user, settings:State.settings,
    transactions:State.transactions, sources:State.sources, accounts:State.accounts,
    categories:State.categories, transfers:State.transfers, attachments:State.attachments,
  };
}
async function createBackup(){
  const snap = await buildSnapshot();
  const json = JSON.stringify(snap);
  // simple xor "encryption" with passphrase (NOT crypto-secure, but obfuscates; web crypto would need async keys)
  const pass = prompt('Set a passphrase to encrypt this backup (leave empty for unencrypted):','') || '';
  let payload = json, encrypted=false, hash='';
  if(pass){
    encrypted=true;
    // derive a key stream from passphrase
    const enc = new TextEncoder().encode(json);
    const keyBytes = new TextEncoder().encode(pass);
    const out = new Uint8Array(enc.length);
    for(let i=0;i<enc.length;i++) out[i] = enc[i] ^ keyBytes[i % keyBytes.length];
    // base64 encode
    payload = btoa(String.fromCharCode(...out));
    hash = await sha256Hex(payload);
  } else {
    hash = await sha256Hex(json);
  }
  const record = { id:uid('bk'), createdAt:nowISO(), size: snap.transactions.length+snap.sources.length+snap.accounts.length, encrypted, hash:hash.slice(0,16), payload };
  State.backupRecords.push(record);
  await db.put('backupRecords', record);
  await saveSetting('lastBackup', record.createdAt);
  // download
  const blob = new Blob([JSON.stringify({moneyjournal_backup:1,encrypted,hash,payload,createdAt:record.createdAt})], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download='money-journal-backup-'+todayISODate()+'.json'; a.click();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
  toast('Backup created and downloaded'+(encrypted?' (encrypted)':''),'success');
  navigate('settings', {tab:'backup'});
}
async function restoreBackup(){
  const inp = document.createElement('input'); inp.type='file'; inp.accept='.json,application/json';
  inp.onchange = async (e)=>{
    const file = e.target.files[0]; if(!file) return;
    const text = await file.text();
    let parsed;
    try { parsed = JSON.parse(text); } catch(err){ toast('Invalid backup file: not JSON','error'); return; }
    if(!parsed || !parsed.payload){ toast('Invalid backup format','error'); return; }
    const pass = prompt('Enter the passphrase (leave empty if backup was unencrypted):','') || '';
    let json;
    if(parsed.encrypted){
      if(!pass){ toast('This backup is encrypted. Passphrase required.','error'); return; }
      try {
        const bin = atob(parsed.payload);
        const enc = new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) enc[i]=bin.charCodeAt(i);
        const keyBytes = new TextEncoder().encode(pass);
        const out = new Uint8Array(enc.length);
        for(let i=0;i<enc.length;i++) out[i] = enc[i] ^ keyBytes[i % keyBytes.length];
        json = new TextDecoder().decode(out);
        JSON.parse(json); // validate
      } catch(err){ toast('Wrong passphrase or corrupted backup','error'); return; }
    } else {
      json = parsed.payload;
    }
    const snap = JSON.parse(json);
    if(snap.app!=='moneyjournal'){ toast('Not a Money Journal backup','error'); return; }
    confirmModal('Restoring will replace ALL current data on this device with the backup contents. Continue?', async ()=>{
      await Promise.all(['transactions','sources','accounts','categories','transfers','attachments'].map(s=>db.clear(s)));
      State.transactions = snap.transactions||[]; if(snap.transactions) await db.bulkPut('transactions', snap.transactions);
      State.sources = snap.sources||[]; if(snap.sources) await db.bulkPut('sources', snap.sources);
      State.accounts = snap.accounts||[]; if(snap.accounts) await db.bulkPut('accounts', snap.accounts);
      State.categories = snap.categories||[]; if(snap.categories) await db.bulkPut('categories', snap.categories);
      State.transfers = snap.transfers||[]; if(snap.transfers) await db.bulkPut('transfers', snap.transfers);
      State.attachments = snap.attachments||[]; if(snap.attachments) await db.bulkPut('attachments', snap.attachments);
      if(snap.settings) Object.assign(State.settings, snap.settings);
      if(snap.user) Object.assign(State.user, snap.user);
      await saveUser();
      const rec = {id:'app', settings:State.settings, updatedAt:nowISO()}; await db.put('settings', rec);
      toast('Backup restored successfully','success'); navigate('dashboard');
    }, {danger:true, yes:'Restore'});
  };
  inp.click();
}
async function exportJSON(){
  const snap = await buildSnapshot();
  const blob = new Blob([JSON.stringify(snap,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download='money-journal-data-'+todayISODate()+'.json'; a.click();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
  toast('JSON exported','success');
}
async function sha256Hex(s){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

async function init(){
  try { await loadAll(); } catch(e){
    console.error('DB load failed', e);
    $('#content').innerHTML = '<div class="empty"><h4>Storage unavailable</h4><p>This browser does not support IndexedDB, or storage is blocked. Money Journal needs local storage to save your data.</p></div>';
    return;
  }
  setTheme(State.settings.theme||'dark');
  // Update the PIN lock footer to reflect current sync mode.
  const pinFooter=$('#pinFooter');
  if(pinFooter) pinFooter.textContent = Cloud.isAuthed()
    ? 'Synced to your cloud account. PIN protects this device only.'
    : 'Your data is stored locally on this device and never leaves it.';

  // If cloud sync is configured, require authentication before any private
  // view. Handle the #reset hash (clicked from the password reset email)
  // by jumping straight to the reset screen once Supabase has restored
  // the recovery session. Unconfigured browsers fall through to guest mode.
  if(Cloud.configured()){
    try{
      await Cloud.restoreSession();
      if(Cloud.isAuthed()){
        const r = await Cloud.pullAndMerge();
        if(State.settings.theme && State.settings.theme!==document.documentElement.dataset.theme){
          setTheme(State.settings.theme);
        }
        if(r && (r.pulled||r.pushed)) console.info('[cloud] synced:', r);
        Cloud.markSession();
        const u = Cloud.getUser();
        if(u && !u.onboarded){
          Auth.show('onboarding');
          return;
        }
      } else if(location.hash==='#reset'){
        // Password recovery: Supabase restores the session from the email
        // link token; show the reset form so the user can pick a new password.
        Auth.show('reset');
        return;
      } else {
        Auth.show('login');
        return;
      }
    }catch(e){
      console.warn('[cloud] session restore / sync failed:', e.message);
      Auth.show('login');
      return;
    }
  }

  renderShell();
  navigate('dashboard');
  if(State.settings.pinEnabled){
    State.lockState.locked = true;
    showPinLock(false);
  }
}

  if(e.key==='Escape'){ const m=$('.modal-overlay'); if(m) closeModal(); }
});
window.addEventListener('resize', ()=>{ if(State.ready){ const v=State.route.view; if(['dashboard','analytics','calendar'].includes(v)) renderView(v, State.route.params); } });
window.addEventListener('DOMContentLoaded', init);

</script>
